name: 24/7 Job Auto-Apply Bot

on:
  schedule:
    # Run setiap 30 menit dari jam 15:00-05:00 WIB (08:00-22:00 UTC)
    - cron: '0,30 8-21 * * *'
    - cron: '0 22 * * *'
    - cron: '30 22 * * *'
    - cron: '0 23 * * *'
    - cron: '30 23 * * *'
    - cron: '0 0 * * *'
    - cron: '30 0 * * *'
    - cron: '0 1 * * *'
    - cron: '30 1 * * *'
    - cron: '0 2 * * *'
    - cron: '30 2 * * *'
    - cron: '0 3 * * *'
    - cron: '30 3 * * *'
    - cron: '0 4 * * *'
    - cron: '30 4 * * *'
    - cron: '0 5 * * *'
    - cron: '30 5 * * *'
    - cron: '0 6 * * *'
    - cron: '30 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-apply:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
      
      - name: Scrape fresh jobs (fokus developer/engineer)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m job_scraper web3jobsradar --query developer --limit 50 || true
          python -m job_scraper web3jobsradar --query engineer --limit 50 || true
          python -m job_scraper web3jobsradar --query backend --limit 50 || true
          python -m job_scraper web3jobsradar --query frontend --limit 50 || true
          python -m job_scraper web3jobsradar --query "smart contract" --limit 50 || true
          python -m job_scraper web3jobsradar --query blockchain --limit 50 || true
          python -m job_scraper web3jobsradar --query solidity --limit 50 || true
          python -m job_scraper web3jobsradar --query "full stack" --limit 50 || true
          python -m job_scraper web3jobsradar --query python --limit 50 || true
          python -m job_scraper web3jobsradar --query react --limit 50 || true
          python -m job_scraper web3jobsradar --query web3 --limit 50 || true
          python -m job_scraper web3-greenhouse --limit 15 || true
          python -m job_scraper scrape-all || true
          python -m job_scraper stats
      
      - name: Check daily limit
        id: check-limit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FULL_NAME: ${{ secrets.FULL_NAME }}
          FIRST_NAME: ${{ secrets.FIRST_NAME }}
          LAST_NAME: ${{ secrets.LAST_NAME }}
          EMAIL: ${{ secrets.EMAIL }}
          PHONE: ${{ secrets.PHONE }}
          LINKEDIN: ${{ secrets.LINKEDIN }}
          GITHUB: ${{ secrets.PROFILE_URL }}
          PORTFOLIO: ${{ secrets.PORTFOLIO }}
          LOCATION: ${{ secrets.LOCATION }}
          CITY: ${{ secrets.CITY }}
          COUNTRY: ${{ secrets.COUNTRY }}
          DESIRED_ROLE: ${{ secrets.DESIRED_ROLE }}
          WORK_TYPE: ${{ secrets.WORK_TYPE }}
          EXPECTED_SALARY: ${{ secrets.EXPECTED_SALARY }}
          AVAILABILITY: ${{ secrets.AVAILABILITY }}
          YEARS_EXPERIENCE: ${{ secrets.YEARS_EXPERIENCE }}
          EDUCATION: ${{ secrets.EDUCATION }}
          SKILLS: ${{ secrets.SKILLS }}
          LANGUAGES: ${{ secrets.LANGUAGES }}
          AUTHORIZED_TO_WORK: ${{ secrets.AUTHORIZED_TO_WORK }}
          REQUIRES_SPONSORSHIP: ${{ secrets.REQUIRES_SPONSORSHIP }}
        run: |
          python << 'PYEOF'
          import os
          from scheduler import DailyScheduler
          scheduler = DailyScheduler()
          status = scheduler.can_apply()
          can = str(status['can_apply']).lower()
          remaining = str(status['remaining_today'])
          print('can_apply=' + can)
          print('remaining=' + remaining)
          output_file = os.environ['GITHUB_OUTPUT']
          with open(output_file, 'a') as f:
              f.write('can_apply=' + can + '\n')
              f.write('remaining=' + remaining + '\n')
          PYEOF
      
      - name: Run auto-apply
        if: steps.check-limit.outputs.can_apply == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FULL_NAME: ${{ secrets.FULL_NAME }}
          FIRST_NAME: ${{ secrets.FIRST_NAME }}
          LAST_NAME: ${{ secrets.LAST_NAME }}
          EMAIL: ${{ secrets.EMAIL }}
          PHONE: ${{ secrets.PHONE }}
          LINKEDIN: ${{ secrets.LINKEDIN }}
          GITHUB: ${{ secrets.PROFILE_URL }}
          PORTFOLIO: ${{ secrets.PORTFOLIO }}
          LOCATION: ${{ secrets.LOCATION }}
          CITY: ${{ secrets.CITY }}
          COUNTRY: ${{ secrets.COUNTRY }}
          DESIRED_ROLE: ${{ secrets.DESIRED_ROLE }}
          WORK_TYPE: ${{ secrets.WORK_TYPE }}
          EXPECTED_SALARY: ${{ secrets.EXPECTED_SALARY }}
          AVAILABILITY: ${{ secrets.AVAILABILITY }}
          YEARS_EXPERIENCE: ${{ secrets.YEARS_EXPERIENCE }}
          EDUCATION: ${{ secrets.EDUCATION }}
          SKILLS: ${{ secrets.SKILLS }}
          LANGUAGES: ${{ secrets.LANGUAGES }}
          AUTHORIZED_TO_WORK: ${{ secrets.AUTHORIZED_TO_WORK }}
          REQUIRES_SPONSORSHIP: ${{ secrets.REQUIRES_SPONSORSHIP }}
        run: |
          python main.py fill-db --limit ${{ steps.check-limit.outputs.remaining }} --headless
      
      - name: Persist state (commit DB + scheduler)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db data/submissions.json scheduler_state.json scheduler_config.json 2>/dev/null || true
          git commit -m "chore: persist bot state [skip ci]" || echo "Nothing to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master || echo "Push failed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
